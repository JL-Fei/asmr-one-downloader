name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build zip (git archive, 只含已跟踪文件)
        run: |
          set -euo pipefail
          NAME="${GITHUB_REF_NAME}"
          mkdir -p dist
          git archive --format=zip \
            --prefix="asmr-one-downloader-${NAME}/" \
            -o "dist/asmr-one-downloader-${NAME}.zip" HEAD
          unzip -l "dist/asmr-one-downloader-${NAME}.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME="${GITHUB_REF_NAME}"
          cat > /tmp/notes.md <<'EOF'
## 亮点
- **逐文件进度条**：每行显示 `已下 / 总大小 · 百分比 · 实时速度`，完成变绿并标注走的「直连 / 代理」，失败变红直显 curl 原因
- **总进度**：按字节计算，停滞转黄、有失败转红；脚注显示总速度与剩余时间
- **只重试失败的 N 个**：已完成的文件不会重下

## 修复
- 代理写死导致**所有下载必然失败**（`curl: (7)`）：现在先 TCP 探代理端口，没开就直连；媒体域直连优先
- 目录选择器里输入新目录后点「开始下载」无反应（重渲染丢失 await 的 promise）
- API 择台改为**直连优先**：主域活着且不慢就用主域，真实请求慢才在 5 分钟内切换镜像

## 安装
1. 下载下面的 zip 解压，浏览器 `edge://extensions` → 开发人员模式 → 加载解压缩的扩展 → 选该文件夹
2. 复制扩展 ID，在文件夹里执行 `node install.js <扩展ID>`
3. 回 `edge://extensions` 点「重新加载」，打开作品页即可

详见 [README](https://github.com/${{ github.repository }}#安装)。
EOF
          echo "" >> /tmp/notes.md
          echo "## 本次提交" >> /tmp/notes.md
          echo "" >> /tmp/notes.md
          PREV=$(git describe --tags --abbrev=0 "${NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            git log --pretty='- %s (%h)' "${PREV}..HEAD" >> /tmp/notes.md
          else
            git log --pretty='- %s (%h)' >> /tmp/notes.md
          fi
          gh release create "$NAME" "dist/asmr-one-downloader-${NAME}.zip" \
            --title "ASMR One 批量下载器 ${NAME}" \
            --notes-file /tmp/notes.md \
            --verify-tag

      - name: Verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" --json name,tagName,assets
