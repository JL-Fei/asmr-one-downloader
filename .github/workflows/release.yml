name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build zip from tracked files
        run: |
          set -euo pipefail
          NAME="${GITHUB_REF_NAME}"
          mkdir -p dist
          git archive --format=zip --prefix="asmr-one-downloader-${NAME}/" -o "dist/asmr-one-downloader-${NAME}.zip" HEAD
          unzip -l "dist/asmr-one-downloader-${NAME}.zip"

      - name: Compose release notes
        run: |
          set -euo pipefail
          cp .github/release-notes.md /tmp/notes.md
          printf '\n## 本次提交\n\n' >> /tmp/notes.md
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            git log --pretty='- %s (%h)' "${PREV}..HEAD" >> /tmp/notes.md
          else
            git log --pretty='- %s (%h)' >> /tmp/notes.md
          fi
          cat /tmp/notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME="${GITHUB_REF_NAME}"
          gh release create "$NAME" "dist/asmr-one-downloader-${NAME}.zip" --title "ASMR One 批量下载器 ${NAME}" --notes-file /tmp/notes.md --verify-tag

      - name: Verify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" --json name,tagName,assets
